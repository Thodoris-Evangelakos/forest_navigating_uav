# blending distributions using mixture field
# NOTE: world-level params (area_size, object_count, min_distance) come from
#       world.default.yaml — do NOT duplicate them here.
layout:
  type: "mixture_field"

  components:
    - name: "clustered"
      distribution_ref: "clustered.yaml"
      weight: 0.55
    - name: "regular"
      distribution_ref: "regular.yaml"
      weight: 0.45

  field:
    # mixture weight w(x,y) in [0,1] for "clustered"
    kind: "sigmoid_x"
    center_x: 0.0
    width: 8.0        # larger = smoother transition
