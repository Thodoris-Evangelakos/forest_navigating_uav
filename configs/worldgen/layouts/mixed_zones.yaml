# we define fields, hard transitioning between them
# NOTE: K and min_distance come from world.default.yaml (currently K=80).
#       Zone coordinates should stay within [-K/2, K/2].
layout:
  type: "zones"

  zones:
    - name: "west_clustered"
      region:
        shape: "rect"
        x_min: -40
        x_max: 0
        y_min: -40
        y_max: 40
      count: 120
      distribution_ref: "clustered.yaml"

    - name: "east_regular"
      region:
        shape: "rect"
        x_min: 0
        x_max: 40
        y_min: -40
        y_max: 40
      count: 80
      distribution_ref: "regular.yaml"

  transitions:
    enabled: false
