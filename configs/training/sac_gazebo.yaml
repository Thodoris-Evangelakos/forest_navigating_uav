# Demo-only Gazebo config (rollouts/visualization). Training is not supported in Gazebo.
experiment:
  name: sac_gazebo
  runs_dir: outputs/runs
  seed: 42
  total_timesteps: 100000

env:
  backend: gazebo
  check_env: false
  env_kwargs:
    params:
      dt: 0.1
      lidar_num_beams: 180
      lidar_range_max: 30.0
      lidar_min_valid_range: 0.03
      v_max: 6.0
      wz_max: 2.5
      vz_max: 2.0
      r_safe: 0.19
      episode_seconds: 30.0
      goal_tolerance: 0.5
      world_radius: 20.0
      boundary_margin: 1.5
      collision_threshold: 0.18
      default_z_target: 0.3
      z_error_scale: 5.0
      reward_progress_scale: 2.0
      reward_speed_scale: 0.02
      reward_step_penalty: 0.02
      reward_proximity_scale: 0.16
      reward_shield_penalty: 0.015
      reward_collision_penalty: 20.0
      reward_success_bonus: 5.0
      reward_truncation_penalty: 1.0
      reward_yaw_rate_scale: 0.03
      reward_stall_penalty: 0.05
      reward_accel_clip_penalty: 0.05
      progress_stall_threshold: 0.02
      yaw_penalty_speed_gate: 0.25
      shield_floor_z_min: 0.1
      shield_ceiling_z_max: 0.5
      shield_lookahead_margin: 3.0
      shield_yaw_damping: 0.3
      shield_front_arc_deg: 55.0
      shield_ttc_threshold_sec: 0.75
      tree_radius_mean: 0.14
      tree_radius_std: 0.03
      tree_radius_min: 0.08
      tree_radius_max: 0.30
      worldgen_config_relpath: configs/worldgen/worldgen_run.yaml
      worldgen_seed_offset: 0
      odom_topic: /odom
      scan_topic: /scan
      cmd_vel_topic: /model/uav1/cmd_vel
      spin_timeout_sec: 2.0
      settle_time_sec: 0.05
      use_sim_reset_service: false
      reset_service_name: /reset_simulation
      fixed_goal: [8.0, 0.0, 0.3]
      randomize_goal_on_reset: true
      start_goal_clearance: 0.6
      min_start_goal_distance: 8.0
      spawn_max_attempts: 500

      # dynamics control mode: mirror the fastsim hybrid settings for parity.
      action_mode: hybrid
      accel_v_max: 3.0    # m/s**2
      accel_wz_max: 2.0   # rad/s**2
      accel_vz_max: 1.5   # m/s**2
      decel_v_max: 6.0    # m/s**2
      decel_wz_max: 3.0   # rad/s**2
      decel_vz_max: 2.5   # m/s**2

training:
  n_envs: 1
  checkpoint_freq_step: 10000
  norm:
    enabled: true
    norm_obs: true
    norm_reward: true
    clip_obs: 10.0
    clip_reward: 10.0

logging:
  eval_freq_step: 20000
  n_eval_episodes: 10
  metrics_log_freq_step: 1000

sac:
  policy: MlpPolicy
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: -1
  ent_coef: auto
  target_update_interval: 1
  verbose: 1
  policy_kwargs:
    net_arch: [256, 256]

save_vecnorm: false
